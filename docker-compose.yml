# Desarrollo. Levanta Redis, la API, el worker de cálculo y Angular. La base NO va aquí: es el
# servidor local compartido ~/docker/postgres-bd (como mysql-bd para los sistemas de MySQL).
#
#   cd ~/docker/postgres-bd && docker compose up -d --wait    # una sola vez
#   cp backend/.env.example backend/.env
#   docker compose up -d
#   docker compose exec backend npm run migrate
#   docker compose exec backend npm run seed       # catálogos base y datos de ejemplo
#
# Aplicación: http://localhost:4270  (usuario ADMIN, contraseña la de SEED_ADMIN_PASSWORD)
services:
  frontend:
    image: node:24-alpine
    container_name: sigenom-frontend
    working_dir: /app
    ports:
      - "4270:4200"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - /app/backend
    environment:
      CHOKIDAR_USEPOLLING: "true"
      BACKEND_HOST: backend
      BACKEND_PORT: "3080"
    command: >
      sh -c "npm install &&
      npm run start -- --host 0.0.0.0 --port 4200 --poll=1000"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: node:24-alpine
    container_name: sigenom-backend
    working_dir: /app
    ports:
      # Abierto a la red local: la consulta /consulta/capacidad-descuento la usan otros sistemas
      # (docs/api-capacidad-descuento.md). El resto de la API sigue pidiendo sesión.
      - "3098:3080"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3080
      DB_HOST: pg
      REDIS_HOST: redis
    command: >
      sh -c "npm install && npm run start:dev"
    networks:
      - default
      - postgres-bd-red
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Mismo código que la API, otro punto de entrada: solo consume la cola de cálculos.
  # Escala con:  docker compose up -d --scale worker=3
  worker:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      DB_HOST: pg
      REDIS_HOST: redis
    # Espera a que la API haya instalado dependencias y compilado una vez.
    command: >
      sh -c "until [ -f dist/worker.js ]; do sleep 3; done && npm run start:worker:dev"
    networks:
      - default
      - postgres-bd-red
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sigenom-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

networks:
  # La red de ~/docker/postgres-bd: ahí la base se llama "pg".
  postgres-bd-red:
    external: true

volumes:
  frontend_node_modules:
  backend_node_modules:
